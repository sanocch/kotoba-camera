<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="カメラ映像の上に文字枠を表示し、選んだ範囲だけを読み上げるWebアプリ">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>ことばカメラ Live</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">選んだところだけを読む</p>
        <h1>ことばカメラ</h1>
      </div>
      <button id="privacyButton" class="icon-button" type="button" aria-label="画像と通信について">ⓘ</button>
    </header>

    <section class="camera-card">
      <div id="stage" class="stage">
        <video id="camera" playsinline autoplay muted></video>
        <canvas id="analysisCanvas" hidden></canvas>
        <div id="dimLayer" class="dim-layer" hidden></div>
        <div id="ocrOverlay" class="ocr-overlay" aria-label="読みたい文字を選ぶ領域"></div>
        <div id="guide" class="guide"><span>文字にかざして、白い枠が出るまで端末を止めてください</span></div>
      </div>

      <div id="status" class="status" role="status" aria-live="polite">カメラを準備しています</div>
      <div id="progressWrap" class="progress-wrap" hidden>
        <progress id="progress" max="1" value="0"></progress>
        <span id="progressText">準備中</span>
      </div>

      <div class="primary-actions">
        <button id="scanButton" class="button button-primary button-large" type="button" disabled>文字を探す</button>
        <button id="resumeButton" class="button button-large" type="button" hidden>別の場所を読む</button>
      </div>

      <details class="settings">
        <summary>設定</summary>
        <div class="settings-grid">
          <label>文字の向き
            <select id="layoutMode">
              <option value="horizontal">横書き</option>
              <option value="vertical">縦書き</option>
              <option value="auto">自動</option>
            </select>
          </label>
          <label>読み上げ速度
            <input id="speechRate" type="range" min="0.5" max="1.3" step="0.1" value="0.8">
            <output id="speechRateValue">0.8</output>
          </label>
        </div>
      </details>
    </section>

    <section id="selectionPanel" class="panel" hidden>
      <p class="eyebrow">選んだ範囲</p>
      <div id="selectedText" class="selected-text">文字を選んでください</div>
      <p id="selectionHint" class="hint">最初の文字をタップしてください。</p>
      <button id="speakButton" class="button button-primary speak-button" type="button" hidden>🔊 読み上げる</button>
      <button id="clearSelectionButton" class="text-button clear-button" type="button" hidden>選び直す</button>
    </section>
  </main>

  <dialog id="privacyDialog">
    <div class="dialog-content">
      <h2>画像と通信について</h2>
      <p>カメラ映像は画面に表示するだけで、写真アプリや端末の保存領域には保存しません。</p>
      <p>文字認識のため、映像の一場面をページ内の非表示Canvasへ一時コピーします。文字認識はブラウザ内で実行し、画像そのものは外部へ送信しません。</p>
      <button id="closePrivacyButton" class="button button-primary" type="button">閉じる</button>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@6/dist/tesseract.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
